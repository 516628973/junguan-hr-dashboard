<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>均冠人力资源看板 · 2026-08</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; background: #F2F5F9; color: #333; }
  header { background: #1F4E79; color: #fff; padding: 22px 28px; }
  .header-inner { max-width: 1340px; margin: 0 auto; }
  header h1 { font-size: 24px; font-weight: 700; letter-spacing: 1px; }
  header .meta { margin-top: 8px; font-size: 13px; color: #C9D9EA; }
  main { max-width: 1340px; margin: 0 auto; padding: 20px 16px 40px; }
  .card { background: #fff; border-radius: 8px; padding: 18px 20px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(31,78,121,.10); }
  .card h2 { font-size: 17px; color: #1F4E79; border-left: 4px solid #2E75B6; padding-left: 10px; margin-bottom: 14px; }
  .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .card-head h2 { margin-bottom: 0; }
  button { background: #2E75B6; color: #fff; border: none; border-radius: 4px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
  button:hover { background: #1F4E79; }
  .summary { font-size: 14px; line-height: 1.9; color: #444; background: #F7FAFD; border: 1px dashed #B7D7E8; border-radius: 6px; padding: 12px 16px; }
  .kpi-row { display: grid; grid-template-columns: repeat(8, 1fr); gap: 12px; margin-bottom: 16px; }
  .kpi { background: #fff; border-radius: 8px; padding: 14px 10px; text-align: center; box-shadow: 0 1px 4px rgba(31,78,121,.10); border-top: 4px solid #2E75B6; }
  .kpi .num { font-size: 26px; font-weight: 700; color: #1F4E79; }
  .kpi .lab { font-size: 13px; color: #666; margin-top: 6px; }
  .kpi .sub { font-size: 11px; color: #999; margin-top: 4px; }
  .chart-grid { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
  .chart-box { flex: 1 1 46%; min-width: 330px; height: 320px; }
  .chart-box.full { flex: 1 1 100%; }
  .chart-note { font-size: 12px; color: #999; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { border: 1px solid #D8E2EC; padding: 5px 7px; text-align: center; white-space: nowrap; }
  th { background: #B7D7E8; color: #1F4E79; font-weight: 700; }
  tr.sum td { background: #4FA9D5; color: #fff; font-weight: 700; }
  tr.sub td { background: #DCE8F4; font-weight: 600; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 10px; flex-wrap: wrap; }
  .toolbar input, .toolbar select { flex: 1; max-width: 420px; padding: 7px 12px; border: 1px solid #B7D7E8; border-radius: 4px; font-size: 13px; background: #fff; }
  .toolbar select { flex: 0 1 300px; max-width: 300px; cursor: pointer; }
  .tabs { display: flex; gap: 6px; }
  .tabs button { background: #E8EFF6; color: #1F4E79; font-weight: 600; }
  .tabs button.on { background: #2E75B6; color: #fff; }
  .table-wrap { max-height: 540px; overflow: auto; border: 1px solid #E2E9F0; border-radius: 6px; }
  .table-wrap table th { position: sticky; top: 0; z-index: 1; }
  .count-line { font-size: 12px; color: #888; margin-top: 8px; }
  .notes ul { padding-left: 18px; }
  .notes li { font-size: 13px; line-height: 1.9; color: #555; }
  .empty { color: #BBB; }
  .task-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .task-box { border: 1px solid #E2E9F0; border-radius: 6px; overflow: hidden; background: #fff; }
  .task-box .tb-head { padding: 8px 14px; color: #fff; font-weight: 700; font-size: 14px; display: flex; justify-content: space-between; }
  .task-box ul { list-style: none; padding: 6px 14px; max-height: 240px; overflow: auto; }
  .task-box li { font-size: 13px; line-height: 2; color: #444; border-bottom: 1px dashed #EEF2F6; display: flex; justify-content: space-between; gap: 10px; }
  .task-box li:last-child { border-bottom: none; }
  .tb-date { color: #1F4E79; font-weight: 600; white-space: nowrap; }
  .tb-empty { color: #999; text-align: center; padding: 14px; font-size: 13px; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; color: #fff; }
  .tag-在职 { background: #70AD47; } .tag-待离职 { background: #ED7D31; } .tag-离职 { background: #A6A6A6; }
  footer { text-align: center; font-size: 12px; color: #999; padding: 10px 0 24px; }
  @media (max-width: 1100px) { .kpi-row { grid-template-columns: repeat(4, 1fr); } .chart-box { flex: 1 1 100%; } }
  @media print {
    header, button, .toolbar, .tabs { display: none; }
    .card { box-shadow: none; border: 1px solid #ddd; break-inside: avoid; }
    body { background: #fff; }
    .kpi-row { grid-template-columns: repeat(4, 1fr); }
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <h1>浙江均冠创新科技有限公司 · 人力资源看板</h1>
    <div class="meta" id="metaLine"></div>
  </div>
</header>
<main>

  <section class="card">
    <div class="card-head"><h2>管理摘要</h2><button id="btnCopySummary">复制摘要</button></div>
    <div class="summary" id="summaryText" contenteditable="true"></div>
  </section>

  <section class="kpi-row" id="kpiRow"></section>

  <section class="card">
    <h2>一、组织与人数结构</h2>
    <div class="chart-grid">
      <div class="chart-box" id="chartDept"></div>
      <div class="chart-box" id="chartOffice"></div>
      <div class="chart-box" id="chartCompany"></div>
      <div class="chart-box" id="chartGroup"></div>
    </div>
    <div class="chart-note" id="groupNote"></div>
  </section>

  <section class="card">
    <h2>二、职级与司龄结构</h2>
    <div class="chart-grid">
      <div class="chart-box" id="chartLevel"></div>
      <div class="chart-box" id="chartTenure"></div>
      <div class="chart-box" id="chartGender"></div>
      <div class="chart-box" id="chartEdu"></div>
      <div class="chart-box" id="chartJobClass"></div>
    </div>
  </section>

  <section class="card">
    <h2>三、人员画像</h2>
    <div class="chart-grid">
      <div class="chart-box" id="chartAge"></div>
      <div class="chart-box" id="chartDeptAge"></div>
    </div>
  </section>

  <section class="card">
    <h2>四、人力趋势（2026年月度）</h2>
    <div class="chart-grid">
      <div class="chart-box full" id="chartTrend"></div>
    </div>
  </section>

  <section class="card">
    <h2>五、离职分析</h2>
    <div class="chart-grid">
      <div class="chart-box" id="chartLeaveMonth"></div>
      <div class="chart-box" id="chartLeaveType"></div>
      <div class="chart-box" id="chartLeaveDept"></div>
      <div class="chart-box" id="chartLeaveReason"></div>
    </div>
    <div class="chart-note" id="leaveNote"></div>
  </section>

  <section class="card">
    <div class="card-head"><h2>六、部门 × 职级交叉表（在职已定级 <span id="crossCount">-</span> 人）</h2><button id="btnCopyCross">复制表格</button></div>
    <div class="table-wrap" id="crossWrap"></div>
  </section>

  <section class="card">
    <div class="card-head"><h2>七、人员明细表（在册 <span id="rosterTotal">-</span> 条）</h2><button id="btnCopyRoster">复制明细</button></div>
    <div class="toolbar">
      <div class="tabs" id="statusTabs"></div>
      <div class="tabs" id="catTabs"></div>
    </div>
    <div class="toolbar">
      <select id="hireMonthFilter"><option value="">入职月份（不限）</option></select>
      <select id="leaveMonthFilter"><option value="">离职月份（不限）</option></select>
      <select id="typeFilter"><option value="">离职类型（不限）</option></select>
      <select id="reasonFilter"><option value="">离职原因（不限）</option></select>
      <input id="searchInput" type="text" placeholder="按 姓名 / 部门 / 职位 / 职级 / 办公点 快速筛选…">
    </div>
    <div class="table-wrap" id="rosterWrap"></div>
    <div class="count-line" id="rosterCount"></div>
  </section>

  <section class="card">
    <div class="card-head"><h2>八、招聘职位（<span id="jobCount">-</span> 个）</h2><button id="btnCopyJobs">复制职位表</button></div>
    <div class="toolbar">
      <div class="tabs" id="jobStatusTabs"></div>
      <div class="tabs" id="jobUrgencyTabs"></div>
    </div>
    <div class="toolbar">
      <select id="jobDeptFilter"><option value="">部门（不限）</option></select>
      <select id="jobOwnerFilter"><option value="">负责人（不限）</option></select>
    </div>
    <div class="table-wrap" id="jobsWrap"></div>
    <div class="count-line" id="jobsNote"></div>
  </section>

  <section class="card">
    <div class="card-head"><h2>九、近期待办（<span id="taskMonth">-</span>）</h2><button id="btnCopyTasks">复制待办</button></div>
    <div class="task-grid" id="taskGrid"></div>
  </section>

  <section class="card notes">
    <h2>数据口径与说明</h2>
    <ul id="notesList"></ul>
  </section>

</main>
<footer>浙江均冠创新科技有限公司 · 人力资源看板 · 仅供内部管理使用</footer>

<script>window.DATA = /*__DATA__*/;</script>
<script>
(function(){
  var D = window.DATA;
  if(!D){ document.body.innerHTML = '<p style="padding:40px">数据加载失败</p>'; return; }

  // ===== 筛选状态记忆（记住上次点击的定位）=====
  var _state = { rosterStatus: '在职', jobStatus: '进行中' };
  function loadState(){
    try {
      var raw = localStorage.getItem('hrdash_state');
      if (raw) { var s = JSON.parse(raw); if (s && typeof s === 'object') _state = s; }
    } catch(e) {}
  }
  function saveState(){
    try {
      var s = { rosterStatus: curStatus, cat: curCat, jobStatus: curJobStatus, jobUrgency: curJobUrgency };
      ['hireMonthFilter','leaveMonthFilter','typeFilter','reasonFilter'].forEach(function(id){
        var el = document.getElementById(id); if (el) s[id] = el.value;
      });
      ['jobDeptFilter','jobOwnerFilter'].forEach(function(id){
        var el = document.getElementById(id); if (el) s[id] = el.value;
      });
      localStorage.setItem('hrdash_state', JSON.stringify(s));
    } catch(e) {}
  }
  loadState();

  document.getElementById('metaLine').textContent =
    '数据快照：' + D.snapshot + ' ｜ 数据来源：' + D.source + ' ｜ 生成日期：' + new Date().toLocaleDateString('zh-CN');

  // ================= 管理摘要 =================
  var A = D.attrition_ytd;
  var sumLines = [
    '截至 ' + D.snapshot + '，公司在册 ' + D.total_register + ' 条记录（含历史离职 ' + D.attrition_hist.count + ' 人），当前在职 ' + D.total_active + ' 人（含待离职 ' + D.total_pending + ' 人，仍按在职口径统计），覆盖 ' + D.dept1_count + ' 个一级部门。',
    '团队年轻化显著：平均年龄 ' + D.avg_age + ' 岁，26-30 岁为绝对主力（' + D.age_buckets['26-30岁'] + ' 人），本科及以上学历占 ' + Math.round((D.edu['本科'] + D.edu['硕士']) / D.total_active * 100) + '%（本科 ' + D.edu['本科'] + ' 人、硕士 ' + D.edu['硕士'] + ' 人）；女性员工 ' + D.gender['女'] + ' 人（占 ' + Math.round(D.gender['女'] / D.total_active * 100) + '%）。',
    '组织以运营部为核心（' + D.dept1['运营部'] + ' 人，占 ' + Math.round(D.dept1['运营部'] / D.total_active * 100) + '%），杭州杭曜为总部办公点（' + D.office['杭州-杭曜'] + ' 人，占 ' + Math.round(D.office['杭州-杭曜'] / D.total_active * 100) + '%）。职级方面已定级 ' + D.cover.level + ' 人：专业轨 ' + D.prof + ' 人（P1/P2 共 ' + (D.levels.P1 + D.levels.P2) + ' 人）、管理轨 ' + D.mgmt + ' 人（M1 ' + D.levels.M1 + ' 人）。',
    '团队处于高速扩张期：' + D.trend[0].m.replace('2026-', '') + ' 至 ' + D.trend[D.trend.length-1].m.replace('2026-', '') + ' 在册人数由 ' + D.trend[0].start + ' 人变为 ' + D.trend[D.trend.length-1].end + ' 人，年内累计入职 ' + A.hire + ' 人、离职 ' + A.leave + ' 人，综合离职率 ' + A.total_rate + '%（主动 ' + A.vol_rate + '% / 被动 ' + A.invol_rate + '%）；其中试用期离职 ' + A.prob + ' 人（占离职总数 ' + Math.round(A.prob / A.leave * 100) + '%），新员工融入与试用期留存是当前人力工作的首要课题。',
    '司龄不足 1 年员工 ' + D.tenure_buckets['<1年'] + ' 人（占 ' + Math.round(D.tenure_buckets['<1年'] / D.cover.tenure * 100) + '%），历史累计离职 ' + D.attrition_hist.count + ' 人以个人原因（' + D.attrition_hist.reason[0][1] + ' 人）和试用期不合适辞退（' + D.attrition_hist.reason[1][1] + ' 人）为主，建议从招聘精准度与试用期管理两端入手改善。'
  ];
  document.getElementById('summaryText').textContent = sumLines.join('\n');

  // ================= KPI =================
  var kpiDefs = [
    { n: D.total_active, lab: '在职人数', sub: '含待离职 ' + D.total_pending + ' 人' },
    { n: D.avg_age, lab: '平均年龄', sub: '覆盖 ' + D.cover.age + ' 人', unit: '岁' },
    { n: D.avg_tenure, lab: '平均司龄', sub: '覆盖 ' + D.cover.tenure + ' 人', unit: '年' },
    { n: Math.round(D.gender['女'] / D.total_active * 100) + '%', lab: '女性占比', sub: '女 ' + D.gender['女'] + ' / 男 ' + D.gender['男'] },
    { n: Math.round((D.edu['本科'] + D.edu['硕士']) / D.total_active * 100) + '%', lab: '本科及以上', sub: '本科 ' + D.edu['本科'] + ' / 硕士 ' + D.edu['硕士'] },
    { n: D.cover.level, lab: '已定级', sub: '定级率 ' + Math.round(D.cover.level / D.total_active * 100) + '%' },
    { n: A.hire, lab: '年内入职', sub: '年初 ' + A.start + ' 人' },
    { n: A.leave, lab: '年内离职', sub: '综合离职率 ' + A.total_rate + '%' }
  ];
  var kpiHtml = '';
  kpiDefs.forEach(function(k){
    kpiHtml += '<div class="kpi"><div class="num">' + k.n + (k.unit ? '<span style="font-size:14px;color:#888"> ' + k.unit + '</span>' : '') + '</div><div class="lab">' + k.lab + '</div><div class="sub">' + k.sub + '</div></div>';
  });
  document.getElementById('kpiRow').innerHTML = kpiHtml;

  // ================= 工具 =================
  function makeChart(id, opt){ var el = document.getElementById(id); var c = echarts.init(el); c.setOption(opt); window.addEventListener('resize', function(){ c.resize(); }); return c; }
  function baseOpt(){ return { color: ['#2E75B6'], tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, backgroundColor: '#fff', borderColor: '#B7D7E8', textStyle: { color: '#333', fontSize: 12 } }, grid: { left: 8, right: 30, top: 34, bottom: 8, containLabel: true } }; }
  function donutOpt(title, pairs, colors){
    return {
      color: colors,
      title: { text: title, left: 'center', textStyle: { fontSize: 14, color: '#1F4E79' } },
      tooltip: { trigger: 'item', backgroundColor: '#fff', borderColor: '#B7D7E8', textStyle: { color: '#333' }, formatter: '{b}：{c} 人（{d}%）' },
      series: [{ type: 'pie', radius: ['42%', '68%'], center: ['50%', '56%'], label: { formatter: '{b}\n{c}人 {d}%', fontSize: 12 }, data: pairs.map(function(x){ return { name: x[0], value: x[1] }; }) }]
    };
  }
  function hbarOpt(title, pairs, colors, fmt){
    var data = pairs.slice().sort(function(a,b){ return a[1]-b[1]; });
    return Object.assign(baseOpt(), {
      title: { text: title, left: 'center', textStyle: { fontSize: 14, color: '#1F4E79' } },
      xAxis: { type: 'value' },
      yAxis: { type: 'category', data: data.map(function(x){ return x[0]; }), axisLabel: { fontSize: 11 } },
      series: [{ type: 'bar', barWidth: 14, label: { show: true, position: 'right', formatter: fmt || null }, data: data.map(function(x, i){ return { value: x[1], itemStyle: { color: colors ? (typeof colors === 'function' ? colors(x[0]) : colors[i % colors.length]) : '#2E75B6' } }; }) }]
    });
  }
  function vbarOpt(title, labels, values, colors, extra){
    var o = Object.assign(baseOpt(), {
      title: { text: title, left: 'center', textStyle: { fontSize: 14, color: '#1F4E79' } },
      xAxis: { type: 'category', data: labels, axisLabel: { fontSize: 11 } },
      yAxis: { type: 'value' },
      series: [{ type: 'bar', barWidth: 30, label: { show: true, position: 'top' }, data: values.map(function(v, i){ return { value: v, itemStyle: { color: typeof colors === 'function' ? colors(labels[i]) : (colors[i % colors.length]) } }; }) }]
    });
    if (extra) Object.assign(o.series[0], extra.series);
    return o;
  }

  function dictToPairs(d){ return Object.keys(d).map(function(k){ return [k, d[k]]; }); }

  // ================= 一、组织与人数 =================
  makeChart('chartDept', hbarOpt('一级部门人数分布（在职 ' + D.total_active + ' 人）', dictToPairs(D.dept1), function(n){ return n === '运营部' ? '#1F4E79' : '#2E75B6'; }, function(p){ return p.value + '（' + Math.round(p.value / D.total_active * 100) + '%）'; }));

  var officePairs = dictToPairs(D.office);
  makeChart('chartOffice', donutOpt('办公点分布', officePairs, ['#2E75B6', '#ED7D31', '#70AD47']));

  var companyPairs = dictToPairs(D.company);
  makeChart('chartCompany', hbarOpt('合同所属公司分布（在职 ' + D.total_active + ' 人）', companyPairs, '#7030A0', function(p){ return p.value + '（' + Math.round(p.value / D.total_active * 100) + '%）'; }));

  var groupPairs = dictToPairs(D.dept2);
  makeChart('chartGroup', hbarOpt('二级小组分布（已标注 ' + groupPairs.reduce(function(s,x){return s+x[1];},0) + ' 人）', groupPairs, '#70AD47', function(p){ return p.value + '（' + Math.round(p.value / D.total_active * 100) + '%）'; }));
  document.getElementById('groupNote').textContent = '说明：在职人员中仅 ' + groupPairs.reduce(function(s,x){return s+x[1];},0) + ' 人标注了小组归属（运营部各组 + 技术/数据组 + 温州设计部），其余 ' + (D.total_active - groupPairs.reduce(function(s,x){return s+x[1];},0)) + ' 人未标注小组，未纳入上图。';

  // ================= 二、职级与司龄 =================
  var lvOrder = ['M2','M1','P5','P4','P3','P2','P1'];
  makeChart('chartLevel', vbarOpt('职级分布（已定级 ' + D.cover.level + ' 人：管理轨 ' + D.mgmt + ' / 专业轨 ' + D.prof + '）', lvOrder, lvOrder.map(function(k){ return D.levels[k]; }), function(k){ return k.indexOf('M') === 0 ? '#2E75B6' : '#ED7D31'; }));

  var tenOrder = ['<1年','1-2年','2-3年','3-5年','5年+'];
  makeChart('chartTenure', vbarOpt('司龄区间分布（覆盖 ' + D.cover.tenure + ' 人）', tenOrder, tenOrder.map(function(k){ return D.tenure_buckets[k]; }), ['#5B9BD5']));

  var genderPairs = dictToPairs(D.gender);
  makeChart('chartGender', donutOpt('性别结构（在职 ' + D.total_active + ' 人）', genderPairs, ['#C0504D', '#2E75B6']));

  var eduPairs = dictToPairs(D.edu);
  makeChart('chartEdu', donutOpt('学历结构（在职 ' + D.total_active + ' 人）', eduPairs, ['#2E75B6', '#5B9BD5', '#9DC3E6', '#C9D9EA', '#ED7D31']));

  var jcPairs = dictToPairs(D.jobclass);
  makeChart('chartJobClass', donutOpt('职业分类结构', jcPairs, ['#1F4E79', '#2E75B6', '#70AD47']));

  // ================= 三、人员画像 =================
  var ageOrder = ['21-25岁','26-30岁','31-35岁','36-40岁','41岁+'];
  makeChart('chartAge', vbarOpt('年龄结构（覆盖 ' + D.cover.age + ' 人，平均 ' + D.avg_age + ' 岁）', ageOrder, ageOrder.map(function(k){ return D.age_buckets[k]; }), ['#7030A0']));

  var daPairs = Object.keys(D.dept_avg_age).map(function(k){ return [k, D.dept_avg_age[k]]; }).sort(function(a,b){ return a[1]-b[1]; });
  makeChart('chartDeptAge', Object.assign(baseOpt(), {
    title: { text: '各部门平均年龄（覆盖 ' + D.cover.age + ' 人）', left: 'center', textStyle: { fontSize: 14, color: '#1F4E79' } },
    xAxis: { type: 'value' },
    yAxis: { type: 'category', data: daPairs.map(function(x){ return x[0]; }), axisLabel: { fontSize: 11 } },

    var p = navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(txt).then(function(){ return true; }).catch(function(){ fallback(); return true; }) : Promise.resolve(fallback());
    p.then(function(){
      var old = btn.textContent; btn.textContent = '已复制 ✓'; setTimeout(function(){ btn.textContent = old; }, 1500);
    });
  }
  function tableToTxt(table){
    var rows = table.querySelectorAll('tr');
    var out = [];
    rows.forEach(function(r){
      var cells = r.querySelectorAll('th, td');
      out.push(Array.prototype.map.call(cells, function(c){ return c.textContent.trim(); }).join('\t'));
    });
    return out.join('\n');
  }
  document.getElementById('btnCopySummary').addEventListener('click', function(e){ copyText(document.getElementById('summaryText').textContent, e.target); });
  document.getElementById('btnCopyCross').addEventListener('click', function(e){ copyText(tableToTxt(document.querySelector('#crossWrap table')), e.target); });
  document.getElementById('btnCopyRoster').addEventListener('click', function(e){ copyText(tableToTxt(document.querySelector('#rosterWrap table')), e.target); });

  // ================= 数据口径 =================
  var notes = [
    '数据来源：' + D.source + '，数据快照 ' + D.snapshot + '；看板基于「全员名册」与「总表」两个工作表生成，每次更新自动从在线文档实时取数。',
    '在册 ' + D.total_register + ' 条记录 = 在职 ' + D.total_active + ' 人（含待离职 ' + D.total_pending + ' 人，仍在职故按在职口径统计）+ 历史离职 ' + D.attrition_hist.count + ' 人；与「总表」当前在职 ' + A.current + ' 人口径一致。',
    '字段覆盖率（在职 ' + D.total_active + ' 人）：一级部门 / 性别 / 办公点 / 学历全覆盖；司龄 ' + D.cover.tenure + '、年龄 ' + D.cover.age + '、职级 ' + D.cover.level + '（其余为试用期未定级）。',
    '2026 年年度指标来自「总表」年度统计：年初在职 88 人、当年入职 ' + A.hire + ' 人、当年离职 ' + A.leave + ' 人（主动 ' + A.vol + ' / 被动 ' + A.invol + '）、年平均人数 ' + A.avg_hc + ' 人；综合离职率 = 离职 ' + A.leave + ' ÷ 年平均 ' + A.avg_hc + ' = ' + A.total_rate + '%，主动离职率 ' + A.vol_rate + '%、被动离职率 ' + A.invol_rate + '%。',
    '月度趋势由「总表」月初在职 + 当月入职 - 当月离职推算；4 月起进入密集扩编期（4-6 月月均入职 16 人）。',
    '在职小组分布仅覆盖已标注小组的 ' + groupPairs.reduce(function(s,x){return s+x[1];},0) + ' 人（eBay/亚马逊各组、DTC、技术组、数据组、温州设计部），其余人员未标注。',
    '「全员名册」中存在同名员工：郑洁、郑佳怡各 2 人，明细表中已分别保留，不影响汇总统计。',
    '本看板为交互式 HTML：图表支持悬停查看明细，明细表支持按状态筛选与关键字搜索、一键复制，Ctrl+P 可打印为 A4 报告。'
  ];
  var ul = document.getElementById('notesList');
  notes.forEach(function(n){ var li = document.createElement('li'); li.textContent = n; ul.appendChild(li); });
})();
